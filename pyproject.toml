[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-fds"
version = "0.1.0"
description = "Privacy-preserving federated fraud detection MVP"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24,<2",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "streamlit>=1.31",
  "plotly>=5.18",
  "PyYAML>=6.0",
  "kafka-python>=2.0",
  "openai>=1.0",
  "opacus>=1.4",
  "flwr>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]
